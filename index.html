
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0756A8">

    <title>نظام إنشاء قائمة التعبئة</title>

    <style>

        /* =========================
           الهوية البصرية
        ========================= */

        :root {
            --blue-dark: #063B78;
            --blue: #0756A8;
            --blue-main: #0875D1;
            --blue-light: #2E9BEF;
            --blue-soft: #EAF5FF;
            --white: #FFFFFF;
            --text: #12304A;
            --shadow: rgba(4, 62, 122, 0.20);
        }


        /* =========================
           الإعدادات العامة
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(46, 155, 239, 0.25),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(7, 86, 168, 0.30),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #F7FBFF 0%,
                    #EAF5FF 45%,
                    #DDEEFF 100%
                );

            color: var(--text);
        }


        /* =========================
           الخلفية
        ========================= */

        .page {
            min-height: 100vh;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            padding: 25px;
        }


        /* الدوائر الزخرفية */

        .circle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(1px);
        }

        .circle-one {
            width: 420px;
            height: 420px;

            top: -220px;
            right: -150px;

            background:
                linear-gradient(
                    135deg,
                    rgba(7, 86, 168, 0.17),
                    rgba(46, 155, 239, 0.04)
                );
        }

        .circle-two {
            width: 330px;
            height: 330px;

            bottom: -180px;
            left: -100px;

            background:
                linear-gradient(
                    135deg,
                    rgba(8, 117, 209, 0.14),
                    rgba(46, 155, 239, 0.03)
                );
        }


        /* =========================
           البطاقة الرئيسية
        ========================= */

        .welcome-card {

            width: min(560px, 100%);

            min-height: 610px;

            background: rgba(255, 255, 255, 0.90);

            border: 1px solid rgba(255, 255, 255, 0.95);

            border-radius: 30px;

            box-shadow:
                0 25px 70px var(--shadow),
                0 5px 20px rgba(0, 0, 0, 0.04);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 55px 45px;

            position: relative;
            z-index: 2;

            animation: cardAppear 0.8s ease forwards;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* =========================
           الشعار
        ========================= */

        .logo-wrapper {

            width: 150px;
            height: 150px;

            border-radius: 50%;

            background: #FFFFFF;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 18px;

            box-shadow:
                0 12px 35px rgba(7, 86, 168, 0.16);

            border: 1px solid rgba(7, 86, 168, 0.08);

            margin-bottom: 35px;

            position: relative;
        }


        .logo-wrapper::after {

            content: "";

            position: absolute;

            inset: -7px;

            border-radius: 50%;

            border: 1px solid rgba(8, 117, 209, 0.13);

            pointer-events: none;
        }


        .logo {

            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }


        /* =========================
           العنوان
        ========================= */

        .welcome-title {

            font-size: clamp(27px, 4vw, 38px);

            font-weight: 800;

            color: var(--blue-dark);

            text-align: center;

            line-height: 1.5;

            margin-bottom: 12px;
        }


        .welcome-subtitle {

            font-size: 16px;

            font-weight: 400;

            color: #66809A;

            text-align: center;

            line-height: 1.8;

            max-width: 400px;

            margin-bottom: 42px;
        }


        /* =========================
           زر الدخول
        ========================= */

        .login-button {

            width: min(340px, 100%);

            height: 62px;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue-dark),
                    var(--blue),
                    var(--blue-main)
                );

            color: #FFFFFF;

            font-size: 18px;

            font-weight: 700;

            font-family: inherit;

            cursor: pointer;

            box-shadow:
                0 12px 28px rgba(7, 86, 168, 0.28);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;

            position: relative;

            overflow: hidden;
        }


        .login-button::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.25),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.6s ease;
        }


        .login-button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 17px 35px rgba(7, 86, 168, 0.35);

            filter: brightness(1.04);
        }


        .login-button:hover::before {

            left: 130%;
        }


        .login-button:active {

            transform: translateY(0);

            box-shadow:
                0 8px 20px rgba(7, 86, 168, 0.25);
        }


        /* =========================
           التذييل
        ========================= */

        .footer {

            position: absolute;

            bottom: 22px;

            left: 0;
            right: 0;

            text-align: center;

            color: #7A93AA;

            font-size: 12px;

            z-index: 3;
        }


        /* =========================
           الجوال
        ========================= */

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
            }

            .page {
                padding: 18px;
            }

            .welcome-card {

                min-height: 570px;

                border-radius: 25px;

                padding:
                    45px
                    25px
                    55px;
            }

            .logo-wrapper {

                width: 125px;
                height: 125px;

                margin-bottom: 28px;
            }

            .welcome-title {
                font-size: 28px;
            }

            .welcome-subtitle {
                font-size: 14px;
                margin-bottom: 35px;
            }

            .login-button {
                height: 58px;
            }

            .footer {
                position: fixed;
                bottom: 10px;
            }
        }

    </style>

</head>


<body>

    <main class="page">

        <!-- خلفية زخرفية -->
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>


        <!-- بطاقة الترحيب -->
        <section class="welcome-card">

            <!-- الشعار -->
            <div class="logo-wrapper">

                <img
                    src="logo.png"
                    alt="شعار الشركة"
                    class="logo"
                >

            </div>


            <!-- العنوان -->
            <h1 class="welcome-title">
                أهلاً بك في نظام أوراق التصدير
            </h1>


            <p class="welcome-subtitle">
                نظام إلكتروني متكامل لإنشاء وتجهيز مستندات التصدير
                وقوائم التعبئة بطريقة سهلة وسريعة.
            </p>


            <!-- زر الدخول -->
            <button
                class="login-button"
                type="button"
                onclick="enterSystem()"
            >
                الدخول
            </button>

        </section>


        <!-- التذييل -->
        <footer class="footer">
            نظام إنشاء أوراق التصدير
        </footer>

    </main>


    <script>

        function enterSystem() {

            /*
                لاحقًا سنستبدل هذا الجزء
                بالانتقال إلى الصفحة الرئيسية للنظام.

                مثال:
                window.location.href = "dashboard.html";
            */

            window.location.href = "dashboard.html";

        }

    </script>

</body>

</html>

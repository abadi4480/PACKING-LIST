
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0756A8">

    <title>الرئيسية | نظام إنشاء قائمة التعبئة</title>

    <style>

        /* =========================================
           الهوية البصرية
        ========================================= */

        :root {

            --blue-dark: #063B78;
            --blue: #0756A8;
            --blue-main: #0875D1;
            --blue-light: #2E9BEF;

            --blue-soft: #EAF5FF;

            --white: #FFFFFF;

            --text: #12304A;
            --text-light: #6C849B;

            --border: rgba(7, 86, 168, 0.10);

            --shadow:
                0 18px 50px rgba(4, 62, 122, 0.13);

        }


        /* =========================================
           Reset
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            min-height: 100%;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

        }


        body {

            min-height: 100vh;

            color: var(--text);

            background:

                radial-gradient(
                    circle at 10% 90%,
                    rgba(46, 155, 239, 0.15),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 10%,
                    rgba(7, 86, 168, 0.14),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #F8FCFF 0%,
                    #EDF7FF 50%,
                    #E2F0FF 100%
                );

        }


        /* =========================================
           الترويسة
        ========================================= */

        .top-header {

            height: 82px;

            width: 100%;

            background:
                linear-gradient(
                    110deg,
                    var(--blue-dark),
                    var(--blue),
                    var(--blue-main)
                );

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0
                clamp(20px, 5vw, 70px);

            box-shadow:
                0 5px 25px rgba(4, 62, 122, 0.20);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        /* =========================================
           جهة الشعار واسم النظام
        ========================================= */

        .brand {

            display: flex;

            align-items: center;

            gap: 15px;

            color: var(--white);

        }


        .brand-logo {

            width: 50px;

            height: 50px;

            background: #FFFFFF;

            border-radius: 13px;

            padding: 6px;

            object-fit: contain;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.12);

        }


        .brand-info {

            display: flex;

            flex-direction: column;

            gap: 2px;

        }


        .brand-title {

            font-size: 18px;

            font-weight: 800;

            line-height: 1.3;

        }


        .brand-subtitle {

            font-size: 11px;

            opacity: 0.78;

            font-weight: 400;

        }


        /* =========================================
           زر الرئيسية
        ========================================= */

        .home-button {

            height: 48px;

            min-width: 48px;

            padding:
                0
                15px;

            border-radius: 13px;

            border: 1px solid rgba(255,255,255,0.20);

            background:
                rgba(255,255,255,0.10);

            color: #FFFFFF;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            cursor: pointer;

            font-family: inherit;

            font-size: 13px;

            font-weight: 600;

            transition:
                0.25s ease;

        }


        .home-button:hover {

            background:
                rgba(255,255,255,0.20);

            transform: translateY(-2px);

        }


        .home-icon {

            width: 20px;

            height: 20px;

            display: block;

        }


        /* =========================================
           المحتوى
        ========================================= */

        .main-content {

            min-height:
                calc(100vh - 82px);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding:
                60px 25px 80px;

        }


        .page-title {

            font-size:
                clamp(25px, 4vw, 35px);

            font-weight: 800;

            color: var(--blue-dark);

            margin-bottom: 10px;

            text-align: center;

        }


        .page-description {

            color: var(--text-light);

            font-size: 15px;

            text-align: center;

            margin-bottom: 48px;

        }


        /* =========================================
           البطاقات
        ========================================= */

        .services {

            width: min(850px, 100%);

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 28px;

        }


        .service-card {

            min-height: 280px;

            background:
                rgba(255,255,255,0.92);

            border:

                1px solid
                var(--border);

            border-radius: 25px;

            box-shadow:
                var(--shadow);

            padding: 35px 30px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;

        }


        .service-card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    var(--blue-dark),
                    var(--blue-light)
                );

            transform:
                scaleX(0);

            transform-origin:
                center;

            transition:
                transform 0.3s ease;

        }


        .service-card:hover {

            transform:
                translateY(-8px);

            box-shadow:
                0 25px 60px rgba(4,62,122,0.20);

            border-color:
                rgba(8,117,209,0.22);

        }


        .service-card:hover::before {

            transform:
                scaleX(1);

        }


        /* =========================================
           أيقونة الخدمة
        ========================================= */

        .service-icon {

            width: 92px;

            height: 92px;

            border-radius: 24px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 25px;

            background:
                linear-gradient(
                    145deg,
                    #E9F5FF,
                    #D9ECFF
                );

            color:
                var(--blue);

            box-shadow:
                inset 0 0 0 1px
                rgba(7,86,168,0.06);

            transition:
                transform 0.3s ease;

        }


        .service-card:hover .service-icon {

            transform:
                scale(1.06);

        }


        .service-icon svg {

            width: 48px;

            height: 48px;

            stroke:
                currentColor;

            fill:
                none;

            stroke-width: 1.7;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =========================================
           عنوان الخدمة
        ========================================= */

        .service-title {

            font-size: 21px;

            font-weight: 800;

            color:
                var(--blue-dark);

            margin-bottom: 9px;

        }


        .service-description {

            color:
                var(--text-light);

            font-size: 13px;

            line-height: 1.8;

            max-width: 290px;

        }


        /* =========================================
           التذييل
        ========================================= */

        .footer {

            position: fixed;

            bottom: 15px;

            left: 0;

            right: 0;

            text-align: center;

            font-size: 11px;

            color: #7C94AA;

            pointer-events: none;

        }


        /* =========================================
           Responsive
        ========================================= */

        @media (max-width: 700px) {

            .top-header {

                height: 72px;

                padding:
                    0 18px;

            }


            .brand-logo {

                width: 43px;

                height: 43px;

            }


            .brand-title {

                font-size: 15px;

            }


            .brand-subtitle {

                display: none;

            }


            .home-button {

                padding: 0 11px;

            }


            .home-button span {

                display: none;

            }


            .main-content {

                min-height:
                    calc(100vh - 72px);

                padding:
                    40px 18px 70px;

            }


            .page-description {

                margin-bottom: 30px;

            }


            .services {

                grid-template-columns:
                    1fr;

                gap: 18px;

                max-width: 430px;

            }


            .service-card {

                min-height: 240px;

            }

        }


    </style>

</head>


<body>


    <!-- =====================================
         الترويسة الثابتة
    ====================================== -->

    <header class="top-header">


        <!-- الشعار واسم النظام -->

        <div class="brand">

            <img
                src="logo.png"
                alt="شعار الشركة"
                class="brand-logo"
            >

            <div class="brand-info">

                <div class="brand-title">
                    نظام إنشاء قائمة التعبئة
                </div>

                <div class="brand-subtitle">
                    نظام المستندات التجارية والتصدير
                </div>

            </div>

        </div>


        <!-- العودة للرئيسية -->

        <button
            class="home-button"
            onclick="goHome()"
            title="الصفحة الرئيسية"
        >

            <svg
                class="home-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M3 10.5L12 3l9 7.5"
                />

                <path
                    d="M5.5 9.5V21h13V9.5"
                />

                <path
                    d="M9.5 21v-6h5v6"
                />

            </svg>

            <span>
                الرئيسية
            </span>

        </button>


    </header>


    <!-- =====================================
         المحتوى الرئيسي
    ====================================== -->

    <main class="main-content">


        <h1 class="page-title">
            ماذا تريد أن تنشئ؟
        </h1>


        <p class="page-description">
            اختر نوع المستند الذي ترغب في إعداده
        </p>


        <section class="services">


            <!-- =================================
                 إنشاء قائمة تعبئة
            ================================== -->

            <article
                class="service-card"
                onclick="createPackingList()"
                role="button"
                tabindex="0"
            >

                <div class="service-icon">

                    <!-- أيقونة قائمة التعبئة -->

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M6 3h9l4 4v14H6z"
                        />

                        <path
                            d="M15 3v5h4"
                        />

                        <path
                            d="M9 12h6"
                        />

                        <path
                            d="M9 16h6"
                        />

                        <path
                            d="M9 8h2"
                        />

                    </svg>

                </div>


                <h2 class="service-title">
                    إنشاء قائمة تعبئة
                </h2>


                <p class="service-description">
                    إنشاء وتجهيز Packing List
                    للشحنات التصديرية وإعداده للطباعة.
                </p>

            </article>


            <!-- =================================
                 إنشاء طلب نما
            ================================== -->

            <article
                class="service-card"
                onclick="createNAMA()"
                role="button"
                tabindex="0"
            >

                <div class="service-icon">

                    <!-- أيقونة المستند -->

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M6 3h9l4 4v14H6z"
                        />

                        <path
                            d="M15 3v5h4"
                        />

                        <path
                            d="M9 12h6"
                        />

                        <path
                            d="M9 16h6"
                        />

                        <path
                            d="M9 8h3"
                        />

                        <path
                            d="M16 15l2 2 3-4"
                        />

                    </svg>

                </div>


                <h2 class="service-title">
                    إنشاء مستند طلب نما
                </h2>


                <p class="service-description">
                    تجهيز مستند طلب نما
                    وإدخال بيانات الشحنة والتصدير.
                </p>

            </article>


        </section>


    </main>


    <!-- =====================================
         التذييل
    ====================================== -->

    <footer class="footer">

        نظام إنشاء قائمة التعبئة

    </footer>


    <script>


        /* العودة للصفحة الرئيسية */

        function goHome() {

            window.location.href = "index.html";

        }


        /* إنشاء قائمة تعبئة */

        function createPackingList() {

            window.location.href =
                "packing-list.html";

        }


        /* إنشاء طلب نما */

        function createNAMA() {

            window.location.href =
                "nama.html";

        }


        /* دعم لوحة المفاتيح */

        document
            .querySelectorAll(".service-card")
            .forEach(card => {

                card.addEventListener(
                    "keydown",
                    function(event) {

                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {

                            event.preventDefault();

                            card.click();

                        }

                    }
                );

            });


    </script>


</body>

</html>
